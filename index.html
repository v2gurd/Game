<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07131d">
<title>AZAD SHAHR — Open World</title>
<style>
:root{--glass:rgba(8,18,28,.78);--line:rgba(190,225,245,.22);--mint:#74f0c1;--white:#f4f8fb}

.act{height:58px;border-radius:17px;border:1px solid #d9edf455;color:#fff;background:linear-gradient(145deg,#172d3bdf,#07131deF);font-weight:bold;font-size:11px;box-shadow:0 6px 20px #0006;touch-action:none}
.act:active,.act.active{background:linear-gradient(145deg,#176b64,#0c393d);border-color:#78f4ca}
#hint{position:absolute;bottom:182px;left:50%;transform:translateX(-50%);font-size:10px;color:#e6f0f4;background:#07131dcc;padding:8px 12px;border-radius:30px;white-space:nowrap}
#rotate{display:none;position:fixed;inset:0;z-index:20;background:#07131d;color:white;align-items:center;justify-content:center;text-align:center;padding:30px}
#rotate .inner{max-width:280px}#rotate .phone{font-size:48px;display:block;margin-bottom:18px;animation:turn 1.8s ease-in-out infinite alternate}
@keyframes turn{to{transform:rotate(90deg)}}
@media(orientation:portrait){#rotate{display:flex}#hud{opacity:.25}}
@media(min-width:900px){#bottom{height:190px;padding-left:42px;padding-right:42px}#joy{width:138px;height:138px}#nub{left:43px;top:43px}#actions{grid-template-columns:repeat(2,78px)}.act{height:64px}}
</style>
</head>

<div id="rotate"><div class="inner"><span class="phone">▱</span><b>گوشی را افقی کنید</b><p>شهر آزاد برای بازی در حالت افقی طراحی شده است</p></div></div>
<div id="hud">
 <div id="brand" class="panel"><b>AZAD SHAHR <span style="color:#fff">/</span> شهر آزاد</b><small>OPEN WORLD • OFFLINE BUILD</small></div>
 <div id="stats" class="panel">
  <div class="statline"><span>پول</span><strong id="money">۲٬۵۰۰ $</strong></div>

 </div>
 <div id="mission" class="panel"><b>ماموریت آزاد</b><div id="missionText">در شهر بگرد، ماشین پیدا کن و محیط را کشف کن</div></div>

  <div id="joy"><div id="nub"></div></div>
  <div id="actions">
   <button class="act" id="run">دویدن</button><button class="act" id="fire">شلیک</button>
   <button class="act" id="enter">سوار / پیاده</button><button class="act" id="jump">پرش</button>
  </div>
 </div>
</div>
<script>
(()=>{'use strict';

const V=(x,y,z)=>[x,y,z], add=(a,b)=>a.map((v,i)=>v+b[i]), sub=(a,b)=>a.map((v,i)=>v-b[i]), mul=(a,s)=>a.map(v=>v*s), dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0), cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], norm=a=>mul(a,1/(Math.hypot(...a)||1));

function sphere(m,x,y,z,r,col,seg=9,rings=6){for(let i=0;i<rings;i++){let a=-Math.PI/2+i*Math.PI/rings,b=-Math.PI/2+(i+1)*Math.PI/rings;for(let j=0;j<seg;j++){let u=j*2*Math.PI/seg,v=(j+1)*2*Math.PI/seg;let pt=(aa,uu)=>V(x+r*Math.cos(aa)*Math.cos(uu),y+r*Math.sin(aa),z+r*Math.cos(aa)*Math.sin(uu));quad(m,pt(a,u),pt(a,v),pt(b,v),pt(b,u),col)}}}

const ground=meshData();box(ground,0,-.35,0,260,.5,260,[.24,.31,.30]);const groundMesh=makeMesh(ground);staticObj(groundMesh,[0,0,0],[1,1,1]);
const road=meshData();box(road,0,-.06,0,18,.12,250,[.105,.13,.15]);box(road, -.0,-.055,0,250,.11,18,[.105,.13,.15]);const roadMesh=makeMesh(road);staticObj(roadMesh,[0,0,0],[1,1,1]);
const details=meshData();

const buildings=meshData(), windows=meshData(), props=meshData();
const palette=[[.48,.52,.55],[.66,.59,.48],[.36,.45,.49],[.72,.69,.60],[.40,.49,.47],[.55,.47,.42],[.31,.39,.46]];
for(let gx=-5;gx<=5;gx++)for(let gz=-5;gz<=5;gz++){if(Math.abs(gx)<=1&&Math.abs(gz)<=1)continue;let x=gx*22+rnd(-2,2),z=gz*22+rnd(-2,2),w=rnd(8,15),d=rnd(8,15),h=rnd(9,35);let col=palette[Math.floor(Math.random()*palette.length)];box(buildings,x,h/2,z,w,h,d,col);

}
const buildingMesh=makeMesh(buildings),windowMesh=makeMesh(windows);staticObj(buildingMesh,[0,0,0],[1,1,1]);staticObj(windowMesh,[0,0,0],[1,1,1]);
for(let x=-110;x<=110;x+=22)for(let z=-110;z<=110;z+=22){if(Math.abs(x)<15||Math.abs(z)<15)continue; cylinder(props,x,.05,z,.22,3.4,[.24,.29,.30],8);sphere(props,x,3.5,z,1.25,[.13,.34,.22],8,5)}
const propMesh=makeMesh(props);staticObj(propMesh,[0,0,0],[1,1,1]);
// Character model assembled in local coordinates facing -Z
function characterMesh(clothes,skin){let m=meshData();box(m,0,1.05,0,.72,.9,.38,clothes);box(m,-.22,.42,0,.22,.78,.25,[.12,.16,.20]);box(m,.22,.42,0,.22,.78,.25,[.12,.16,.20]);box(m,-.49,1.02,0,.2,.72,.22,clothes);box(m,.49,1.02,0,.2,.72,.22,clothes);sphere(m,0,1.78,0,.29,skin,10,7);box(m,0,2.03,-.01,.58,.12,.34,[.08,.10,.12]);return makeMesh(m)}
const playerMesh=characterMesh([.08,.25,.43],[.77,.52,.36]),npcMeshes=[characterMesh([.45,.19,.14],[.65,.42,.3]),characterMesh([.18,.35,.26],[.82,.62,.46]),characterMesh([.38,.35,.16],[.55,.38,.27])],copMesh=characterMesh([.06,.12,.28],[.73,.51,.36]);

const carMeshes=[carMesh([.72,.19,.09]),carMesh([.12,.32,.48]),carMesh([.72,.72,.66]),carMesh([.16,.18,.19]),carMesh([.75,.55,.12]),carMesh([.08,.13,.22],true)];
const player={x:0,z:4,y:0,yaw:0,health:100,car:null,run:false,jump:0};let cameraYaw=0,cameraPitch=.12,joy={x:0,y:0},keys={},wanted=0,money=2500;
const npcs=[],cars=[],bullets=[],particles=[];
for(let i=0;i<30;i++){let x,z;if(Math.random()<.5){x=rnd(-100,100);z=Math.random()<.5?-12:12}else{z=rnd(-100,100);x=Math.random()<.5?-12:12}npcs.push({x,z,yaw:rnd(0,6.28),mesh:npcMeshes[i%3],phase:rnd(0,6.28),criminal:i%9===0,health:100})}
for(let i=0;i<18;i++){let axis=Math.random()<.5;let lane=(Math.random()<.5?-1:1)*5.1;let x=axis?lane:rnd(-100,100),z=axis?rnd(-100,100):lane;cars.push({x,z,yaw:axis?0:Math.PI/2,mesh:carMeshes[i%5],speed:rnd(1.5,4),ai:true})}

const joyEl=document.getElementById('joy'),nub=document.getElementById('nub');let joyId=null;

window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();jump()}if(e.key.toLowerCase()==='e')enterCar();if(e.key.toLowerCase()==='f')shoot()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function update(dt){let forward=-(joy.y||((keys.w||keys.arrowup)?1:0)-((keys.s||keys.arrowdown)?1:0)),side=joy.x||((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0);let running=player.run||keys.shift;let speed=running?8:4.2;
if(player.car){let c=player.car;c.speed+=(forward*9-c.speed*1.5)*dt;c.speed=Math.max(-8,Math.min(22,c.speed));c.yaw+=side*dt*(Math.abs(c.speed)*.09+.3);c.x+=Math.sin(c.yaw)*c.speed*dt;c.z-=Math.cos(c.yaw)*c.speed*dt;player.x=c.x;player.z=c.z;player.yaw=c.yaw}else{let ang=cameraYaw,fx=Math.sin(ang),fz=-Math.cos(ang),rx=Math.cos(ang),rz=Math.sin(ang);let vx=(fx*forward+rx*side),vz=(fz*forward+rz*side),l=Math.hypot(vx,vz);if(l>1){vx/=l;vz/=l}if(l>.08){player.yaw=Math.atan2(vx,-vz);player.x+=vx*speed*dt;player.z+=vz*speed*dt}}
player.x=Math.max(-122,Math.min(122,player.x));player.z=Math.max(-122,Math.min(122,player.z));if(player.jump>0)player.jump=Math.max(0,player.jump-dt);
for(let c of cars){if(c.ai){c.x+=Math.sin(c.yaw)*c.speed*dt;c.z-=Math.cos(c.yaw)*c.speed*dt;if(Math.abs(c.x)>115||Math.abs(c.z)>115){c.x=Math.sign(c.x||1)*-110;c.z=Math.sign(c.z||1)*-110}}}
for(let n of npcs){n.phase+=dt;let pace=n.criminal?1.5:.65;n.x+=Math.sin(n.phase*.5)*pace*dt;n.z+=Math.cos(n.phase*.7)*pace*dt;if(policeAlert>0&&n.criminal){let dx=n.x-player.x,dz=n.z-player.z,dd=Math.hypot(dx,dz);if(dd<25){n.x+=dx/dd*dt*2;n.z+=dz/dd*dt*2}}}
for(let b of bullets){b.x+=b.dx*45*dt;b.z+=b.dz*45*dt;b.life-=dt;for(let n of npcs){if(Math.hypot(n.x-b.x,n.z-b.z)<.9){n.health-=100;b.life=0;if(n.criminal){money+=250;toast('خلافکار متوقف شد +۲۵۰')}else wanted=Math.min(5,wanted+1)}}}
for(let i=bullets.length-1;i>=0;i--)if(bullets[i].life<=0)bullets.splice(i,1);
if(policeAlert>0){policeAlert-=dt;if(Math.random()<dt*.08)wanted=Math.max(0,wanted-1)}else if(wanted)wanted=Math.max(0,wanted-dt*.025);
if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)document.getElementById('toast').style.opacity=0}
updateHUD()}
function render(){let w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,1.65);if(canvas.width!==Math.floor(w*dpr)||canvas.height!==Math.floor(h*dpr)){canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);gl.viewport(0,0,canvas.width,canvas.height)}
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let target=player.car?V(player.x,1,player.z):V(player.x,1.3+player.jump*2,player.z);let yaw=cameraYaw+(player.car?player.yaw:0),dist=player.car?9:7.4;let eye=V(target[0]-Math.sin(yaw)*dist,target[1]+3.3+cameraPitch*8,target[2]+Math.cos(yaw)*dist);let vp=matMul(perspective(1.03,canvas.width/canvas.height,.1,260),lookAt(eye,target,V(0,1,0)));gl.uniformMatrix4fv(loc.vp,false,new Float32Array(vp));gl.uniform3f(loc.sun,-.45,.85,.3);gl.uniform3f(loc.fog,.43,.58,.62);gl.uniform1f(loc.time,performance.now()/1000);
for(let o of city)draw(o.mesh,transform(o.pos,o.scale,o.yaw));
for(let c of cars)draw(c.mesh,transform([c.x,.1,c.z],[1,1,1],c.yaw));
if(!player.car)draw(playerMesh,transform([player.x,player.jump*2,player.z],[1,1,1],player.yaw));
for(let n of npcs)if(n.health>0)draw(n.mesh,transform([n.x,0,n.z],[1,1,1],n.yaw));
for(let b of bullets)draw(cube,transform([b.x,b.y,b.z],[.09,.09,.5],Math.atan2(b.dx,-b.dz)));
drawMinimap()}
function drawMinimap(){let c=document.getElementById('map'),x=c.getContext('2d'),s=180;x.clearRect(0,0,s,s);x.fillStyle='#172b35';x.fillRect(0,0,s,s);x.strokeStyle='#65767a';x.lineWidth=10;for(let p of [-12,12]){x.beginPath();x.moveTo(90+p*0.58,0);x.lineTo(90+p*.58,180);x.stroke();x.beginPath();x.moveTo(0,90+p*.58);x.lineTo(180,90+p*.58);x.stroke()}x.fillStyle='#d7caa0';for(let b of city.filter(o=>o.mesh===buildingMesh)){let xx=90+b.pos[0]*.58,yy=90+b.pos[2]*.58;x.fillRect(xx-3,yy-3,6,6)}x.fillStyle='#f1f5f5';for(let n of npcs){let xx=90+n.x*.58,yy=90+n.z*.58;x.fillRect(xx,yy,2,2)}x.fillStyle='#efb35c';x.beginPath();x.arc(90+player.x*.58,90+player.z*.58,4,0,Math.PI*2);x.fill();x.strokeStyle='#fff';x.lineWidth=1.5;x.beginPath();x.moveTo(90+player.x*.58,90+player.z*.58);x.lineTo(90+player.x*.58+Math.sin(player.yaw)*9,90+player.z*.58-Math.cos(player.yaw)*9);x.stroke()}
let last=performance.now(),fps=0;function frame(now){let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.getElementById('missionText').textContent='به چهارراه مرکزی برو، ماشین پیدا کن و شهر را آزادانه بگرد';
})();
