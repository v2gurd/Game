<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON DRIVE ULTRA</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a12;color:#fff;font-family:Vazirmatn,system-ui;touch-action:none}#view{position:fixed;inset:0}
#loading,#menu{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#19334b,#050911 70%);z-index:10;padding:22px}
#loading{z-index:20;transition:opacity .45s}.card{width:min(500px,94vw);padding:26px;text-align:center;border:1px solid #8bdcff55;border-radius:25px;background:#091725eF;box-shadow:0 25px 90px #000b;backdrop-filter:blur(16px)}
h1{font-size:clamp(36px,9vw,64px);letter-spacing:5px;margin:0;color:#69dfff;text-shadow:0 0 30px #00aaff77}p{color:#bed0df;font-size:13px;line-height:2}.btn{border:0;border-radius:14px;padding:13px 32px;font:900 15px Vazirmatn;background:linear-gradient(100deg,#0c9fe9,#75eaff);color:#03121d}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px;padding:12px}.glass{background:#071522c9;border:1px solid #8bdcff3b;border-radius:15px;padding:9px 13px;backdrop-filter:blur(12px);box-shadow:0 8px 25px #0005}.logo{font-weight:900;color:#6cddff;letter-spacing:2px}.logo small{display:block;font-size:9px;color:#aec8d9;letter-spacing:3px}.stats{display:flex;gap:7px}.stat{text-align:center;min-width:68px}.stat small{display:block;color:#a8bdcd;font-size:10px}.stat b{font-size:18px}.speed{font-size:28px!important;color:white}.bottom{position:absolute;bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end}.nitro{width:145px}.bar{height:8px;border-radius:10px;background:#263746;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#00a8ff,#a3f7ff);box-shadow:0 0 15px #00caff}
#toast{position:absolute;top:25%;left:50%;transform:translateX(-50%);font-weight:900;font-size:26px;text-shadow:0 4px 20px #000;opacity:0;transition:opacity .2s}
#controls{position:fixed;z-index:7;bottom:18px;left:0;right:0;display:none;justify-content:space-between;padding:0 15px;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;pointer-events:auto}.control{border:1px solid #9ee8ff66;background:#071a2bd0;color:white;border-radius:14px;font:800 13px Vazirmatn;touch-action:none}.control:active,.control.on{background:#087eb9}.actions{display:flex;gap:7px;align-items:end;pointer-events:auto}.actions button{width:58px;height:58px}.actions #gas{height:83px;background:#087c58d9}.actions #brake{background:#a52d43d9}.actions #boost{background:#087bb9d9}
@media(pointer:coarse),(max-width:800px){#controls{display:flex}.bottom{bottom:165px}.top{padding:8px}.glass{padding:7px 9px}.stat{min-width:55px}.stat b{font-size:15px}.speed{font-size:23px!important}.nitro{width:105px}}
</style>
</head>
<body>
<div id="view"></div>
<div id="loading"><div class="card"><h1>NEON DRIVE</h1><p id="loadText">در حال بارگذاری مدل‌های سه‌بعدی واقعی...</p></div></div>
<div id="menu" style="display:none"><div class="card"><h1>NEON DRIVE</h1><p>نسخه ULTRA · رانندگی آزاد در شهر سه‌بعدی<br>مدل خودرو و محیط از فایل‌های GLB واقعی بارگذاری می‌شوند.</p><button class="btn" id="start">شروع رانندگی</button></div></div>
<div id="hud"><div class="top"><div class="glass logo">NEON DRIVE<small>ULTRA CITY BUILD</small></div><div class="stats"><div class="glass stat"><small>امتیاز</small><b id="score">۰</b></div><div class="glass stat"><small>مسافت</small><b id="distance">۰ m</b></div><div class="glass stat"><small>سرعت</small><b id="speed" class="speed">۰</b><small>KM/H</small></div></div></div><div id="toast"></div><div class="bottom"><div class="glass" style="font-size:10px;color:#bed0df">WASD / جهت‌ها · Space دریفت · Shift نیترو</div><div class="glass nitro">NITRO<div class="bar"><i id="nitroBar"></i></div></div></div></div>
<div id="controls"><div class="pad"><button class="control" data-k="left" style="grid-column:1;grid-row:1">◀</button><button class="control" data-k="right" style="grid-column:3;grid-row:1">▶</button><button class="control" data-k="drift" style="grid-column:2;grid-row:2">DRIFT</button></div><div class="actions"><button class="control" id="boost" data-k="boost">N₂O</button><button class="control" id="brake" data-k="brake">ترمز</button><button class="control" id="gas" data-k="gas">گاز</button></div></div>
<script type="module">
let THREE, GLTFLoader;
const bootStatus = document.querySelector('#loadText');
async function importEngine(){
  // Import map resolves the bare `three` dependency used inside GLTFLoader.
  THREE = await import('three');
  ({GLTFLoader} = await import('three/addons/loaders/GLTFLoader.js'));
}
try{
  await importEngine();
}catch(err){
  console.error('Three.js module loading failed:',err);
  bootStatus.innerHTML = 'بارگذاری موتور سه‌بعدی ناموفق بود.<br>احتمالاً دسترسی Safari به jsDelivr مسدود است یا اینترنت قطع شده.<br><button class="btn" onclick="location.reload()">تلاش دوباره</button>';
  throw err;
}

const host=document.querySelector('#view'), scene=new THREE.Scene();
scene.background=new THREE.Color(0x8da4b7);scene.fog=new THREE.FogExp2(0x91a9bb,.0018);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1500);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcde9ff,0x273442,1.65));
const sun=new THREE.DirectionalLight(0xffdfbd,3.1);sun.position.set(-80,130,70);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-100;sun.shadow.camera.right=100;sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;scene.add(sun);
const loader=new GLTFLoader();let player=null,city=null,carTemplate=null;const traffic=[];
const loadText=document.querySelector('#loadText');
const MODEL_CAR='https://threejs.org/examples/models/gltf/ferrari.glb';
const MODEL_CITY='https://threejs.org/examples/models/gltf/LittlestTokyo.glb';
const HDR='https://threejs.org/examples/textures/equirectangular/royal_esplanade_1k.hdr';
function ground(){
 const asphalt=new THREE.Mesh(new THREE.PlaneGeometry(26,1800),new THREE.MeshStandardMaterial({color:0x252b32,roughness:.88}));asphalt.rotation.x=-Math.PI/2;asphalt.position.z=-500;asphalt.receiveShadow=true;scene.add(asphalt);
 const shoulder=new THREE.Mesh(new THREE.PlaneGeometry(110,1800),new THREE.MeshStandardMaterial({color:0x35483c,roughness:1}));shoulder.rotation.x=-Math.PI/2;shoulder.position.set(0,-.04,-500);scene.add(shoulder);
 const white=new THREE.MeshStandardMaterial({color:0xe9e3d3,roughness:.7});
 for(let x of [-12.5,12.5]){let edge=new THREE.Mesh(new THREE.BoxGeometry(.18,.025,1800),white);edge.position.set(x,.02,-500);scene.add(edge)}
 for(let z=30;z>-1400;z-=13){let dash=new THREE.Mesh(new THREE.BoxGeometry(.18,.025,6),white);dash.position.set(0,.025,z);dash.userData.scroll=true;scene.add(dash)}
}
ground();
function normalizeModel(root,target=4){
 const b=new THREE.Box3().setFromObject(root),size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());
 const max=Math.max(size.x,size.y,size.z);root.scale.setScalar(target/max);root.position.sub(center.multiplyScalar(target/max));
 const bb=new THREE.Box3().setFromObject(root);root.position.y-=bb.min.y;
 root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.envMapIntensity=1.15}}});
}
function cloneTraffic(){
 const clone=carTemplate.clone(true);clone.scale.copy(player.scale);clone.position.set([-8,-4,4,8][Math.floor(Math.random()*4)],0,-90-Math.random()*800);
 clone.rotation.y=Math.PI;clone.userData.trafficSpeed=12+Math.random()*20;scene.add(clone);traffic.push(clone);
}
const load=(url)=>new Promise((resolve,reject)=>loader.load(url,resolve,undefined,reject));
function timedLoad(url,label,timeoutMs=25000){
 loadText.textContent=label;
 return Promise.race([
  load(url),
  new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timeout: '+url)),timeoutMs))
 ]);
}
try{
 const carGltf=await timedLoad(MODEL_CAR,'در حال دریافت ماشین Ferrari (حدود ۱.۶ مگابایت)...');
 carTemplate=carGltf.scene;normalizeModel(carTemplate,4.8);
 player=carTemplate.clone(true);player.position.set(0,0,6);scene.add(player);
 // Start becomes available as soon as the car is ready. A slow city download
 // must never trap the player behind an endless loading screen.
 document.querySelector('#loading').style.display='none';
 document.querySelector('#menu').style.display='grid';
 for(let i=0;i<8;i++)cloneTraffic();
 timedLoad(MODEL_CITY,'ماشین آماده شد؛ در حال دریافت محیط شهری...',35000).then(cityGltf=>{
   city=cityGltf.scene;normalizeModel(city,95);
   city.position.set(0,0,-150);city.rotation.y=Math.PI;scene.add(city);
   toast('محیط شهری بارگذاری شد');
 }).catch(err=>{
   console.error('City model failed:',err);
   toast('مدل شهر دریافت نشد؛ رانندگی در جاده فعال است');
 });
}catch(err){
 console.error('Car model failed:',err);
 loadText.innerHTML='مدل ماشین از اینترنت دریافت نشد.<br>احتمالاً CDN در دسترس نیست یا دانلود بیش از ۲۵ ثانیه طول کشیده.<br><small style="color:#9db8ca">آدرس مدل: threejs.org/examples/models/gltf/ferrari.glb</small><br><button class="btn" onclick="location.reload()">تلاش دوباره</button>';
 document.querySelector('#loading').style.display='grid';
}
let keys={left:false,right:false,gas:false,brake:false,boost:false,drift:false};
let speed=0,score=0,distance=0,nitro=100,started=false,paused=false,toastTimer;
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.opacity=0,900)}
function key(k,v){keys[k]=v;document.querySelectorAll(`[data-k="${k}"]`).forEach(x=>x.classList.toggle('on',v))}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='w'||k==='arrowup')key('gas',1);if(k==='s'||k==='arrowdown')key('brake',1);if(k==='a'||k==='arrowleft')key('left',1);if(k==='d'||k==='arrowright')key('right',1);if(k==='shift')key('boost',1);if(k===' ')key('drift',1)});
addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')key('gas',0);if(k==='s'||k==='arrowdown')key('brake',0);if(k==='a'||k==='arrowleft')key('left',0);if(k==='d'||k==='arrowright')key('right',0);if(k==='shift')key('boost',0);if(k===' ')key('drift',0)});
document.querySelectorAll('[data-k]').forEach(el=>{let k=el.dataset.k;const dn=e=>{e.preventDefault();key(k,1)},up=e=>{e.preventDefault();key(k,0)};el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)});
document.querySelector('#start').onclick=()=>{if(!player)return;started=true;document.querySelector('#menu').style.display='none';toast('رانندگی شروع شد')};
const clock=new THREE.Clock();let previous=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-previous)/1000,.04);previous=now;
 if(started&&player&&!paused){
  const boost=keys.boost&&nitro>0&&speed>10;
  if(keys.gas)speed+=27*dt;else speed-=7*dt;if(keys.brake)speed-=42*dt;if(boost){speed+=34*dt;nitro=Math.max(0,nitro-24*dt)}else nitro=Math.min(100,nitro+6*dt);
  speed=THREE.MathUtils.clamp(speed,0,boost?65:42);
  const steer=(keys.left?1:0)-(keys.right?1:0),drift=keys.drift&&speed>12;
  player.position.x=THREE.MathUtils.clamp(player.position.x+steer*(drift?13:7.2)*speed/42*dt,-9.2,9.2);
  player.rotation.y=THREE.MathUtils.damp(player.rotation.y,-steer*(drift?.48:.23),5,dt);
  player.rotation.z=THREE.MathUtils.damp(player.rotation.z,-steer*(drift?.17:.07),5,dt);
  const move=speed*dt;distance+=move;score+=speed*dt*.045+(drift?Math.abs(steer)*speed*dt*.8:0);
  scene.traverse(o=>{if(o.userData.scroll){o.position.z+=move;if(o.position.z>25)o.position.z-=1800}});
  for(const c of traffic){c.position.z+=move*(1-c.userData.trafficSpeed/60);if(c.position.z>30){c.position.z=-700-Math.random()*650;c.position.x=[-8,-4,4,8][Math.floor(Math.random()*4)];score+=100;toast('سبقت! +۱۰۰')};if(Math.abs(c.position.z-player.position.z)<4&&Math.abs(c.position.x-player.position.x)<2.4&&speed>8){speed*=.55;c.position.z=-150-Math.random()*200;toast('برخورد!')}}
  if(city){city.position.z+=move*.25;if(city.position.z>100)city.position.z=-700}
  camera.position.x=THREE.MathUtils.damp(camera.position.x,player.position.x*.38,3.5,dt);camera.position.y=THREE.MathUtils.damp(camera.position.y,6.2,3,dt);camera.position.z=THREE.MathUtils.damp(camera.position.z,player.position.z+12,3,dt);camera.lookAt(player.position.x*.2,1,-8);
  document.querySelector('#score').textContent=Math.floor(score).toLocaleString('fa-IR');document.querySelector('#distance').textContent=Math.floor(distance).toLocaleString('fa-IR')+' m';document.querySelector('#speed').textContent=Math.floor(speed*3.6).toLocaleString('fa-IR');document.querySelector('#nitroBar').style.width=nitro+'%';renderer.toneMappingExposure=boost?1.35:1.15;
 }
 renderer.render(scene,camera);
}
requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)paused=true});
</script>
</body></html>
